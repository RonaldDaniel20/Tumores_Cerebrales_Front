name: Deploy pipeline
on:
  push:
    branches: 
      - main
permissions: 
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: Instalar dependencias
        run: npm install
    
      - name: Inject Environments
        run: | 
          mkdir -p src/environments
          cat <<EOF>> src/environments/environments.ts
          export export const environment = {
            production: true,
            apiUrl: '${{ vars.APIURL}}',
            apikeyGif:'${{ secrets.APIKEYGIF }}',
            gifUrl : 'https://api.giphy.com/v1'
          };
          EOF

      - name: Build app
        run: npm run build -- --configuration production  --base-href=/Tumores_Cerebrales_Front/

      - name: Configurar GitHub pages
        uses: actions/configure-pages@v5
      
      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/my-app/browser'
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4