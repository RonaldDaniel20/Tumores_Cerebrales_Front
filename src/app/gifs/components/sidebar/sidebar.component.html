<div class="flex flex-col w-64 h-full bg-slate-950 p-8 gap-6 overflow-y-auto">
    <gifs-side-menu-header />
    <nav class="flex flex-col items-center justify-center gap-2">
        @for(option of sideBarOptions; track option.route){
            <gifs-side-menu-options [option]="option" />
        }
    </nav>
    <div class="flex flex-col ml-10 gap-3">
        @for(searchKey of searchHistoryKeys(); track searchKey ){
            <app-record-search [recordSearch]="searchKey"/>
        }
    </div>
</div>
