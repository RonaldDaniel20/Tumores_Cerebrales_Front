<div class="flex flex-col gap-2">
    <div class="flex flex-row gap-2">
        <div class="flex flex-col justify-center items-center">
            <img src="{{ option().icon }}" alt="Icono" height="30" width="30" />
        </div>
        <a
            class="flex flex-row items-center hover:bg-slate-800 p-2 rounded-md transition-colors duration-200"
            [routerLink]="option().route"
            [routerLinkActive]="'bg-slate-800'"
            [routerLinkActiveOptions]="{ exact: true }"
            >
            <div class="flex flex-col">
                <p class="text-gray-100 font-bold">
                    {{ option().title }}
                </p>
                <p class="text-gray-500 text-sm">
                    {{ option().subtitle }}
                </p>
            </div>
        </a>
    </div>
    <hr class="border-t border-gray-700 my-2" />
</div>
