<div class="flex flex-col min-h-screen items-center justify-center p-4 gap-4">
    <div class="flex flex-col w-full md:flex-row">
        <div class="flex-1 flex flex-col justify-center items-center">
            <div class="w-full max-w-md bg-green-300 p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            1. Seleccionar Radiografia
                        </label>
                        <div class="flex items-center justify-center w-full">
                            <label for="dropzone-file" class="flex flex-col justify-center items-center
                            w-full h-48 border-2 border-gray-300 border-dashed rounded-lg bg-gray-50 
                            cursor-pointer hover:bg-gray-100 transition">
                                <div class="flex flex-col justify-center items-center pt-5 pb-6">
                                    <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                    </svg>
                                    <p class="mb-2 text-sm text-gray-500">
                                        <span class="font-semibold">
                                            Haz clic para subir
                                        </span> o arrastrar la imagen
                                    </p>
                                    <p class="text-xs text-gray-500">
                                        JPG, JPEG o PNG (Max 5MB)
                                    </p>
                                </div>
                                <input id="dropzone-file"
                                    type="file"
                                    class="hidden"
                                    accept="image/jpeg, image/png, image/jpg"
                                    (change)="onFileSelected($event)"
                                />    
                            </label>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-center gap-3">
                        <button (click) = "getPrediccion()" class="items-center justify-center w-3/5 rounded-4xl py-3 px-4 bg-blue-500 text-white hover:bg-blue-600">
                            Analizar imagen
                        </button>
                        <button (click) = "limpiarCampos()" class="items-center justify-center w-2/5 rounded-4xl py-3 px-4 bg-gray-400 text-white hover:bg-gray-600">
                            Limpiar
                        </button>
                    </div>
            </div>
            @if(this.imagePreview){
                <div class="w-full max-w-md bg-green-300 p-6 mt-5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <p class="text-sm text-gray-500">
                        Previsualización de imagen subida
                    </p>
                    <img [src]="imagePreview" alt="Vista previa" class="max-w-full h-auto max-h-40 object-contain rounded-md"/>
                </div>
            }
        </div>
        @if(isResultAvailable()){
            <div class="flex-1 flex flex-col items-center">
                <div class="w-full max-w-md bg-gray-100 p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <label class="text-xl font-bold text-gray-700">
                        Resultado prediccion
                    </label>
                    <p class="text-sm text-gray-500">
                        <strong>TIPO DE TUMOR:</strong> {{this.prediccion().tipo_de_tumor}}
                    </p>
                    <p class="text-sm text-gray-500">
                        <strong>CONFIANZA:</strong> {{this.prediccion().confianza}}
                    </p>
                </div>
            </div>
        }
    </div>
</div>
